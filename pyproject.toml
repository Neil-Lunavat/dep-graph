[project]
name = "depgraphs"
version = "0.0.1"
description = "Reading order over Python import graphs — research pipeline"
requires-python = "==3.12.*"
dependencies = [
    "pandas",
    "pyarrow",
    "huggingface_hub",
    "networkx",
    "pyyaml",
    "unidiff",
    "requests",
    "pygount>=3.2.0",
    "grimp>=3.17",
    "pydeps>=3.0.8",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "jedi>=0.20.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/depgraphs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
