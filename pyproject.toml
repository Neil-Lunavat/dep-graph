[project]
name = "depgraphs"
version = "0.0.1"
description = "Reading order over Python import graphs — research pipeline"
requires-python = "==3.12.*"
dependencies = [
    "pandas",
    "pyarrow",
    "huggingface_hub",
    "networkx",
    "pyyaml",
    "unidiff",
    "requests",
    "pygount>=3.2.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/depgraphs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
